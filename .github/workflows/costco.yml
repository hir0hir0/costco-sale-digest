name: costco-digest

# コストコの安売り情報を集めて site/ を作り直し、GitHub Pages に配信する。
# 巡回先は costco_sources.json（`discover --save` で登録）に従う。

on:
  schedule:
    - cron: "0 22 * * *"   # 毎日 07:00 JST
  workflow_dispatch:
    inputs:
      mode:
        description: "何をする？"
        type: choice
        default: update
        options:
          - update      # 収集してサイトを作り直す（定期実行と同じ）
          - discover    # 巡回先を探して登録し、各ページの構造をログに出す
          - probe       # 指定URL1本の構造だけ調べる
          - mailprobe   # メルマガの価格行とその前後を調べる
      url:
        description: "probe のときに調べるURL"
        type: string
      mail_only:
        description: "update のとき、メールだけ取り込む"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: costco-digest
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: テスト
        run: python -m unittest discover -s tests

      # 任意依存。商品写真をダウンロードするモードでの縮小に使う（無くても動く）
      - name: Pillow
        run: pip install --quiet Pillow

      # ---- 実地調査 ----------------------------------------------------
      - name: 巡回先を探す
        if: inputs.mode == 'discover'
        run: python -m costco.cli discover --save

      - name: 見つけたページの構造を調べる
        if: inputs.mode == 'discover'
        run: |
          python - > urls.txt <<'PY'
          import json
          conf = json.load(open("costco_sources.json"))
          urls = [conf.get("base_url") or "https://www.costco.co.jp/"]
          urls += [e["url"] for e in conf.get("web", [])]
          seen = set()
          print("\n".join(u for u in urls[:8] if not (u in seen or seen.add(u))))
          PY
          while read -r u; do
            [ -z "$u" ] && continue
            echo "::group::probe $u"
            python -m costco.cli probe "$u" --out costco_data/_probe.json || echo "probe 失敗: $u"
            echo "::endgroup::"
          done < urls.txt
          rm -f urls.txt

      - name: メルマガの中身を調べる
        if: inputs.mode == 'mailprobe'
        env:
          COSTCO_IMAP_HOST: ${{ secrets.COSTCO_IMAP_HOST }}
          COSTCO_IMAP_USER: ${{ secrets.COSTCO_IMAP_USER }}
          COSTCO_IMAP_PASSWORD: ${{ secrets.COSTCO_IMAP_PASSWORD }}
        run: python -m costco.cli mailprobe --limit 4 --out costco_data/_probe.json

      - name: 指定URLの構造を調べる
        if: inputs.mode == 'probe'
        run: |
          if [ -z "${{ inputs.url }}" ]; then
            echo "url を指定してください"; exit 1
          fi
          python -m costco.cli probe "${{ inputs.url }}" --out costco_data/_probe.json

      # ---- 通常の更新 --------------------------------------------------
      - name: 収集してサイトを生成
        if: inputs.mode == '' || inputs.mode == 'update'
        env:
          COSTCO_IMAP_HOST: ${{ secrets.COSTCO_IMAP_HOST }}
          COSTCO_IMAP_USER: ${{ secrets.COSTCO_IMAP_USER }}
          COSTCO_IMAP_PASSWORD: ${{ secrets.COSTCO_IMAP_PASSWORD }}
        run: |
          python -m costco.cli update ${{ inputs.mail_only && '--mail-only' || '' }}

      # 生HTMLは gitignore しているので、後から見られるよう成果物として残す
      - name: 取得した生HTMLを保存
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: captures/costco/
          if-no-files-found: ignore
          retention-days: 14

      - name: 変更をコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add costco_data site costco_sources.json
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            what="${{ inputs.mode == 'discover' && '巡回先を更新' || 'セール情報を更新' }}"
            git commit -m "$what ($(TZ=Asia/Tokyo date +%Y-%m-%d))"
            git push
          fi

      - name: Pages を有効化
        if: inputs.mode == '' || inputs.mode == 'update'
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Pages 用にアップロード
        if: inputs.mode == '' || inputs.mode == 'update'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    if: inputs.mode == '' || inputs.mode == 'update'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
